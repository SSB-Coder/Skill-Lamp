command:
  - "uvicorn"
  - "main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"
env:
  - name: DATABRICKS_HOST
    valueFrom: secret
  - name: DATABRICKS_TOKEN
    valueFrom: secret
  - name: GENIE_SPACE_ID
    valueFrom: secret
  - name: USE_MOCK_FALLBACK
    value: "false"
  - name: JWT_SECRET
    valueFrom: secret